@if (checking()) {
  <div class="center"><p class="muted">Loading…</p></div>
} @else if (!loggedIn()) {
  <div class="center">
    <form class="card login" (ngSubmit)="login()">
      <h1>Admin</h1>
      <p class="muted">Enter the master password to manage the stream.</p>
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" name="pw" [(ngModel)]="password" autocomplete="current-password" autofocus required />
      </div>
      <button class="btn primary wide" type="submit" [disabled]="busy() || !password">Sign in</button>
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <a routerLink="/" class="back">← Viewer page</a>
    </form>
  </div>
} @else {
  <header class="top">
    <h1>Streaming admin</h1>
    <span class="spacer"></span>
    <a class="btn small" routerLink="/" target="_blank">Open viewer page ↗</a>
    <button type="button" class="btn small" (click)="logout()">Sign out</button>
  </header>
  <main class="content">
    <app-streamer-panel />
    <div class="security">
      <app-password-card />
    </div>
  </main>
}
